name: physlive-ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: chmod +x ./mvnw
      - run: ./mvnw test
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: react-client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: react-client/package-lock.json }
      - run: npm ci
      - run: npm run check
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.9', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: physlive-android-debug
          path: mobile-app/build/app/outputs/flutter-apk/app-debug.apk
