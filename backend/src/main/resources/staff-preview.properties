# Credentials and model names come from the deployment environment.
physlive.ai.provider.api-key=${AI_API_KEY:}
physlive.ai.provider.base-url=${AI_BASE_URL:https://openrouter.ai/api/v1}
physlive.ai.provider.text-model=${AI_TEXT_MODEL:}
physlive.ai.provider.vision-model=${AI_VISION_MODEL:}
physlive.ai.provider.ocr-prompt-resource=classpath:prompts/physics-ocr-system.txt
physlive.ai.provider.connect-timeout=10s
physlive.ai.provider.read-timeout=120s
physlive.ai.provider.understanding-temperature=0.2
physlive.ai.visual.api-key=${AI_VISUAL_API_KEY:}
physlive.ai.visual.provider=${AI_VISUAL_PROVIDER:openai_compatible}
physlive.ai.visual.base-url=${AI_VISUAL_BASE_URL:https://openrouter.ai/api/v1}
physlive.ai.visual.model=${AI_VISUAL_MODEL:}
physlive.ai.visual.temperature=0.4
physlive.ai.visual.read-timeout=120s
physlive.ai.visual.strict-structured-output=true
physlive.ai.visual.supports-response-format=true
physlive.ai.visual.max-completion-tokens=32000
physlive.ai.visual.reasoning-effort=${AI_VISUAL_REASONING_EFFORT:}
physlive.ai.jev.api-key=${JEV_API_KEY:}
physlive.ai.jev.base-url=${JEV_BASE_URL:}
physlive.ai.jev.model=${JEV_MODEL:}
physlive.ai.jev.timeout=30s
physlive.ai.jev.minimum-confidence=0.25
physlive.ai.jev.minimum-margin=0.08
physlive.ai.jev.maximum-query-characters=20000
physlive.ai.jev.maximum-prompt-characters=80000
physlive.upload.max-image-bytes=10485760
physlive.upload.allowed-image-types=image/png,image/jpeg,image/webp,image/gif
physlive.simulation.runtime.default-step-seconds=0.02
physlive.simulation.runtime.max-duration-seconds=3.2e9
physlive.simulation.runtime.max-samples=16384
physlive.simulation.runtime.max-participants=256
physlive.simulation.runtime.max-equation-depth=32
physlive.simulation.runtime.max-equation-nodes=512
physlive.simulation.runtime.max-program-part-characters=50000
